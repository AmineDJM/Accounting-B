# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Nothing to fill in. Render creates the database, generates the secrets and
# starts the service; the first administrator then claims the platform with
# ADMIN_BOOTSTRAP_CODE (Environment tab) and finishes the setup from
# /admin/setup — Google sign-in included, with no redeployment.
#
# Deliberately absent:
#   AUTH_URL          Auth.js derives it from the request (trustHost).
#   AUTH_GOOGLE_*     pasted into the console, stored encrypted in the database.
#   SUPER_ADMIN_EMAILS optional; the start-up code covers the first sign-in.
#   COINGECKO_API_KEY  optional; the console takes it too.
services:
  - type: web
    name: finly
    runtime: node
    region: frankfurt            # EU region: Binance/Coinbase APIs refuse some US IPs (HTTP 451)
    plan: starter                # free instances sleep; syncs need a persistent process
    # --include=dev is not optional: NODE_ENV=production below makes npm omit
    # devDependencies, and the build needs Tailwind, PostCSS and TypeScript,
    # which live there. Without it the build dies on globals.css.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"   # a ceiling per process, so the build collects garbage rather than growing into the runner
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finly-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true       # signs the session cookies
      - key: APP_ENCRYPTION_KEY
        generateValue: true       # encrypts exchange API keys at rest (AES-256-GCM)
      - key: ADMIN_BOOTSTRAP_CODE
        generateValue: true       # read it here once, on the first sign-in
      - key: AUTH_DEV_LOGIN
        value: "false"            # never true on a deployment that faces clients
      - key: DB_AUTO_MIGRATE
        value: "true"
databases:
  - name: finly-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
